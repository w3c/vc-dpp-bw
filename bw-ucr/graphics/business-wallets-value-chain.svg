<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d43"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a3c78"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c07d1f"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a4b7a">Business Wallets across an international value chain</text>

  <!-- Certification body -->
  <g>
    <rect x="120" y="55" width="220" height="52" rx="8" fill="#eaf7ec" stroke="#2e7d43" stroke-width="1.5"/>
    <text x="230" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d43">Certification Body</text>
    <text x="230" y="95" text-anchor="middle" font-size="11" fill="#2e7d43">(has its own Business Wallet)</text>
  </g>
  <!-- Market surveillance authority -->
  <g>
    <rect x="620" y="55" width="220" height="52" rx="8" fill="#f6ecf5" stroke="#7a3c78" stroke-width="1.5"/>
    <text x="730" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3c78">Market Surveillance Authority</text>
    <text x="730" y="95" text-anchor="middle" font-size="11" fill="#7a3c78">(has its own Business Wallet)</text>
  </g>

  <!-- Cert body issues credentials to operators -->
  <path d="M 230 107 L 137 240" stroke="#2e7d43" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M 250 107 L 355 240" stroke="#2e7d43" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="255" y="165" text-anchor="middle" font-size="11" fill="#2e7d43">issues certifications /</text>
  <text x="255" y="179" text-anchor="middle" font-size="11" fill="#2e7d43">organisational VCs</text>

  <!-- Authority verifies -->
  <path d="M 730 107 L 810 240" stroke="#7a3c78" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M 760 107 Q 850 300 800 470" stroke="#7a3c78" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="864" y="150" text-anchor="middle" font-size="11" fill="#7a3c78">verifies operator VCs</text>
  <text x="864" y="164" text-anchor="middle" font-size="11" fill="#7a3c78">and DPPs</text>

  <!-- Economic operators -->
  <g id="operators">
    <!-- template repeated -->
    <!-- Operator 1 -->
    <g>
      <rect x="42" y="240" width="190" height="130" rx="10" fill="#eef4fb" stroke="#1a4b7a" stroke-width="1.5"/>
      <text x="137" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4b7a">Raw Material Producer</text>
      <rect x="62" y="278" width="150" height="74" rx="8" fill="#1a4b7a"/>
      <text x="137" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Business Wallet</text>
      <rect x="76" y="308" width="122" height="10" rx="3" fill="#5b86ad"/>
      <rect x="76" y="322" width="122" height="10" rx="3" fill="#5b86ad"/>
      <text x="137" y="345" text-anchor="middle" font-size="8" fill="#cfe0ef">registration · certs · mandates</text>
    </g>
    <!-- Operator 2 -->
    <g>
      <rect x="270" y="240" width="190" height="130" rx="10" fill="#eef4fb" stroke="#1a4b7a" stroke-width="1.5"/>
      <text x="365" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4b7a">Manufacturer</text>
      <rect x="290" y="278" width="150" height="74" rx="8" fill="#1a4b7a"/>
      <text x="365" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Business Wallet</text>
      <rect x="304" y="308" width="122" height="10" rx="3" fill="#5b86ad"/>
      <rect x="304" y="322" width="122" height="10" rx="3" fill="#5b86ad"/>
      <text x="365" y="345" text-anchor="middle" font-size="8" fill="#cfe0ef">registration · certs · mandates</text>
    </g>
    <!-- Operator 3 -->
    <g>
      <rect x="498" y="240" width="190" height="130" rx="10" fill="#eef4fb" stroke="#1a4b7a" stroke-width="1.5"/>
      <text x="593" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4b7a">Distributor / Retailer</text>
      <rect x="518" y="278" width="150" height="74" rx="8" fill="#1a4b7a"/>
      <text x="593" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Business Wallet</text>
      <rect x="532" y="308" width="122" height="10" rx="3" fill="#5b86ad"/>
      <rect x="532" y="322" width="122" height="10" rx="3" fill="#5b86ad"/>
      <text x="593" y="345" text-anchor="middle" font-size="8" fill="#cfe0ef">registration · certs · mandates</text>
    </g>
    <!-- Operator 4 -->
    <g>
      <rect x="726" y="240" width="190" height="130" rx="10" fill="#eef4fb" stroke="#1a4b7a" stroke-width="1.5"/>
      <text x="821" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4b7a">Recycler</text>
      <rect x="746" y="278" width="150" height="74" rx="8" fill="#1a4b7a"/>
      <text x="821" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Business Wallet</text>
      <rect x="760" y="308" width="122" height="10" rx="3" fill="#5b86ad"/>
      <rect x="760" y="322" width="122" height="10" rx="3" fill="#5b86ad"/>
      <text x="821" y="345" text-anchor="middle" font-size="8" fill="#cfe0ef">registration · certs · mandates</text>
    </g>
  </g>

  <!-- Chain arrows between operators -->
  <path d="M 232 305 L 268 305" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 460 305 L 496 305" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 688 305 L 724 305" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="230" text-anchor="middle" font-size="11" fill="#555555" font-style="italic">flow of goods, accompanied by product-level credentials</text>

  <!-- Wallet-to-wallet verification -->
  <path d="M 250 385 Q 365 415 478 388" stroke="#1a4b7a" stroke-width="1.5" fill="none" stroke-dasharray="2,3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="365" y="424" text-anchor="middle" font-size="10" fill="#1a4b7a">wallet ↔ wallet: KYB checks, presentation of organisational VCs</text>

  <!-- DPP band -->
  <g>
    <rect x="42" y="470" width="874" height="108" rx="10" fill="#fdf3e3" stroke="#c07d1f" stroke-width="1.5"/>
    <text x="479" y="496" text-anchor="middle" font-size="14" font-weight="bold" fill="#c07d1f">Digital Product Passport (DPP) — product-level credentials</text>
    <rect x="80" y="512" width="180" height="44" rx="6" fill="#ffffff" stroke="#c07d1f"/>
    <text x="170" y="530" text-anchor="middle" font-size="10" fill="#7a4f11">VC: raw material origin</text>
    <text x="170" y="546" text-anchor="middle" font-size="9" fill="#a97b2f">issuer: Raw Material Producer</text>
    <rect x="290" y="512" width="180" height="44" rx="6" fill="#ffffff" stroke="#c07d1f"/>
    <text x="380" y="530" text-anchor="middle" font-size="10" fill="#7a4f11">VC: conformity, composition</text>
    <text x="380" y="546" text-anchor="middle" font-size="9" fill="#a97b2f">issuer: Manufacturer</text>
    <rect x="500" y="512" width="180" height="44" rx="6" fill="#ffffff" stroke="#c07d1f"/>
    <text x="590" y="530" text-anchor="middle" font-size="10" fill="#7a4f11">VC: handling, custody</text>
    <text x="590" y="546" text-anchor="middle" font-size="9" fill="#a97b2f">issuer: Distributor / Retailer</text>
    <rect x="710" y="512" width="180" height="44" rx="6" fill="#ffffff" stroke="#c07d1f"/>
    <text x="800" y="530" text-anchor="middle" font-size="10" fill="#7a4f11">VC: recovery, recycling</text>
    <text x="800" y="546" text-anchor="middle" font-size="9" fill="#a97b2f">issuer: Recycler</text>
  </g>

  <!-- Issuance arrows from wallets to DPP -->
  <path d="M 148 438 L 155 468" stroke="#c07d1f" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 372 438 L 378 468" stroke="#c07d1f" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 592 438 L 591 468" stroke="#c07d1f" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 810 438 L 803 468" stroke="#c07d1f" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOrange)"/>

  <text x="480" y="605" text-anchor="middle" font-size="10" fill="#888888">Every actor in the value chain — including certification bodies and authorities — operates its own Business Wallet to issue, hold, present and verify credentials.</text>
</svg>
