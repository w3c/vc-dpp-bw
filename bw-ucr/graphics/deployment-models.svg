<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="arrow2Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a4b7a"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a4b7a">Two deployment models for Business Wallets</text>

  <!-- ===================== LEFT: Enterprise wallet ===================== -->
  <rect x="30" y="55" width="430" height="430" rx="12" fill="#f7fafd" stroke="#b9cbdd"/>
  <text x="245" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a4b7a">A — Enterprise wallet</text>

  <!-- Organisation boundary -->
  <rect x="55" y="105" width="380" height="252" rx="10" fill="none" stroke="#1a4b7a" stroke-dasharray="6,4"/>
  <text x="70" y="125" font-size="11" fill="#1a4b7a" font-style="italic">Organisation (legal person)</text>

  <!-- Enterprise wallet -->
  <rect x="150" y="140" width="190" height="90" rx="8" fill="#1a4b7a"/>
  <text x="245" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Enterprise Business Wallet</text>
  <text x="245" y="182" text-anchor="middle" font-size="10" fill="#cfe0ef">server-side · HSM-backed keys</text>
  <rect x="170" y="192" width="150" height="10" rx="3" fill="#5b86ad"/>
  <rect x="170" y="207" width="150" height="10" rx="3" fill="#5b86ad"/>

  <!-- Employees authenticate into it -->
  <circle cx="105" cy="290" r="14" fill="#e8eef5" stroke="#1a4b7a"/>
  <path d="M 91 322 Q 105 304 119 322" fill="#e8eef5" stroke="#1a4b7a"/>
  <text x="105" y="345" font-size="10" text-anchor="middle" fill="#333333">employees</text>
  <circle cx="200" cy="290" r="14" fill="#e8eef5" stroke="#1a4b7a"/>
  <path d="M 186 322 Q 200 304 214 322" fill="#e8eef5" stroke="#1a4b7a"/>
  <rect x="270" y="278" width="110" height="40" rx="6" fill="#e8eef5" stroke="#1a4b7a"/>
  <text x="325" y="295" text-anchor="middle" font-size="10" fill="#333333">automated systems</text>
  <text x="325" y="309" text-anchor="middle" font-size="10" fill="#333333">(ERP, B2B APIs)</text>

  <path d="M 112 276 L 200 235" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M 205 276 L 235 235" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M 315 276 L 285 235" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="60" y="250" font-size="8.5" fill="#555555">authenticate into wallet</text>
  <text x="334" y="250" font-size="8.5" fill="#555555">policy-based</text>

  <!-- Presentation to counterparty -->
  <rect x="150" y="395" width="190" height="60" rx="8" fill="#eef4fb" stroke="#1a4b7a" stroke-width="1.5"/>
  <text x="245" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4b7a">Counterparty / Verifier</text>
  <text x="245" y="438" text-anchor="middle" font-size="10" fill="#555555">bank, supplier, authority</text>
  <path d="M 245 357 L 245 393" stroke="#1a4b7a" stroke-width="2" marker-end="url(#arrow2Blue)"/>
  <text x="252" y="365" font-size="10" fill="#1a4b7a">wallet presents VCs directly;</text>
  <text x="252" y="379" font-size="10" fill="#1a4b7a">credentials never leave custody</text>

  <!-- ===================== RIGHT: Mandate model ===================== -->
  <rect x="500" y="55" width="430" height="430" rx="12" fill="#fbf9f4" stroke="#dccfae"/>
  <text x="715" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6116">B — Mandate model</text>

  <!-- Organisation -->
  <rect x="525" y="105" width="380" height="120" rx="10" fill="none" stroke="#8a6116" stroke-dasharray="6,4"/>
  <text x="540" y="125" font-size="11" fill="#8a6116" font-style="italic">Organisation (legal person)</text>
  <rect x="620" y="135" width="190" height="75" rx="8" fill="#8a6116"/>
  <text x="715" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Organisational Business Wallet</text>
  <text x="715" y="177" text-anchor="middle" font-size="10" fill="#f0e3c5">holds organisational VCs</text>
  <rect x="640" y="187" width="150" height="10" rx="3" fill="#b99544"/>

  <!-- Mandate issuance -->
  <path d="M 715 225 L 715 275" stroke="#8a6116" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="722" y="248" font-size="10" fill="#8a6116">issues mandate VC</text>
  <text x="722" y="262" font-size="10" fill="#8a6116">(scope + validity period)</text>

  <!-- Employee personal wallet -->
  <rect x="600" y="277" width="230" height="88" rx="8" fill="#fdf3e3" stroke="#c07d1f" stroke-width="1.5"/>
  <text x="715" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6116">Employee / Agent personal wallet</text>
  <rect x="618" y="308" width="194" height="20" rx="4" fill="#ffffff" stroke="#c07d1f"/>
  <text x="715" y="322" text-anchor="middle" font-size="10" fill="#7a4f11">mandate VC — "may act for Org X"</text>
  <rect x="618" y="333" width="194" height="20" rx="4" fill="#ffffff" stroke="#c07d1f" stroke-dasharray="3,3"/>
  <text x="715" y="347" text-anchor="middle" font-size="10" fill="#a97b2f">(copy of organisational VC)</text>

  <!-- natural person icon -->
  <circle cx="565" cy="305" r="14" fill="#fdf3e3" stroke="#8a6116"/>
  <path d="M 551 337 Q 565 319 579 337" fill="#fdf3e3" stroke="#8a6116"/>
  <text x="565" y="352" font-size="10" text-anchor="middle" fill="#8a6116">natural person</text>

  <!-- Presentation to counterparty -->
  <rect x="620" y="395" width="190" height="60" rx="8" fill="#eef4fb" stroke="#1a4b7a" stroke-width="1.5"/>
  <text x="715" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4b7a">Counterparty / Verifier</text>
  <text x="715" y="438" text-anchor="middle" font-size="10" fill="#555555">verifies mandate + org VC together</text>
  <path d="M 715 365 L 715 393" stroke="#8a6116" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="722" y="384" font-size="10" fill="#8a6116">presents on organisation's behalf</text>

  <!-- Footer -->
  <text x="480" y="505" text-anchor="middle" font-size="10" fill="#888888">Hybrid deployments combine both models. The choice determines holder binding, key management, and offboarding when an employee leaves.</text>
</svg>
